name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop, 'feat/**' ]
  pull_request:
    branches: [ main, master ]
    types: [ opened, synchronize, reopened ]

jobs:
  validate:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: rag_live_data
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rag_live_data"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Typecheck Application
        run: npm run typecheck

      - name: Run Unit & Integration Tests
        run: npm test
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/rag_live_data
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key-that-is-at-least-32-chars-long
          DEFAULT_LLM_PROVIDER: mock

      - name: Run Retrieval Benchmark Harness
        run: npm run benchmark
        env:
          DEFAULT_LLM_PROVIDER: mock

      - name: Build Next.js Production Bundle
        run: npm run build

  docker-build:
    name: Container Build & Verification
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Unified Next.js Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: rag-app:latest
