services:
  # -------------------------------------------------------------
  # PostgreSQL 16 with pgvector extension
  # -------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: rag_live_data
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/init-pgvector.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_live_data"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Redis: Multi-tier CAG cache & session lock store
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: rag_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # -------------------------------------------------------------
  # Unified Next.js 15 Platform (Agentic RAG Engine + Workspace UI)
  # -------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/rag_live_data
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
      JWT_SECRET: super-secret-production-jwt-token-min-32-chars
      DEFAULT_TENANT_ID: tenant_default_production
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-mock-key}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  redisdata:
